<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechHub</title>
    <link rel="stylesheet" href="../style/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo" onclick="window.location.href='../index.html'" style="cursor: pointer;">
                    <img src="../images/logo.png" alt="TechHub Logo" style="height: 40px; margin-right: 10px;">
                    <span>TechHub</span>
                </div>
                <ul class="nav-menu">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../index.html#products">Products</a></li>
                    <li><a href="../index.html#categories">Categories</a></li>
                    <li><a href="../index.html#accessories">Accessories</a></li>
                    <li><a href="../index.html#deals">Deals</a></li>
                </ul>
            </div>
            <div class="nav-icons">
                <div class="dark-mode-toggle" id="darkModeToggle">
                    <i class="fas fa-moon" id="darkModeIcon"></i>
                </div>
                <div class="auth-buttons">
                    <button class="login-btn">Login</button>
                    <button class="signup-btn" onclick="window.location.href='signup.html'">Sign Up</button>
                </div>
    
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-main">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Login to your TechHub account</p>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>
                    
                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="auth-primary-btn">Login</button>
                </form>
                
                <div class="divider">
                    <span>OR</span>
                </div>
                
                <div class="social-login">
                    <button class="social-btn">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-facebook"></i>
                        Facebook
                    </button>
                </div>
                
                <div class="auth-footer">
                    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../script/script.js"></script>
</body>
</html>
