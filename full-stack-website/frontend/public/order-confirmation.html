<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - TechHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .confirmation-section {
            padding: 4rem 0;
            min-height: calc(100vh - 80px);
            background: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .confirmation-card {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: scaleIn 0.5s ease;
        }
        .success-icon i {
            font-size: 3rem;
            color: white;
        }
        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .confirmation-card h1 {
            color: var(--text-dark);
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        .confirmation-card p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .order-number {
            background: var(--bg-light);
            padding: 1rem;
            border-radius: 8px;
            margin: 1.5rem 0;
        }
        .order-number span {
            display: block;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .order-number strong {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-family: monospace;
        }
        .order-details {
            text-align: left;
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--bg-light);
            border-radius: 8px;
        }
        .order-details h3 {
            margin-bottom: 1rem;
            color: var(--text-dark);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .detail-row:last-child {
            border-bottom: none;
            font-weight: bold;
            color: var(--primary-color);
        }
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background: var(--secondary-color);
        }
        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--border-color);
        }
        [data-theme="dark"] .confirmation-card {
            background: var(--bg-white);
        }
        [data-theme="dark"] .order-number,
        [data-theme="dark"] .order-details {
            background: var(--bg-light);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">
                    <i class="fas fa-computer"></i>
                    <span>TechHub</span>
                </div>
                <div class="dark-mode-toggle" id="darkModeToggle">
                    <i class="fas fa-moon" id="darkModeIcon"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Confirmation Section -->
    <section class="confirmation-section">
        <div class="confirmation-card">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1>Order Confirmed!</h1>
            <p>Thank you for your purchase. Your order has been received and is being processed.</p>
            
            <div class="order-number">
                <span>Order Number</span>
                <strong id="orderNumber">Loading...</strong>
            </div>
            
            <div class="order-details" id="orderDetails">
                <h3>Order Summary</h3>
                <div class="detail-row">
                    <span>Items</span>
                    <span id="itemCount">-</span>
                </div>
                <div class="detail-row">
                    <span>Subtotal</span>
                    <span id="subtotal">-</span>
                </div>
                <div class="detail-row">
                    <span>Shipping</span>
                    <span id="shipping">-</span>
                </div>
                <div class="detail-row">
                    <span>Tax</span>
                    <span id="tax">-</span>
                </div>
                <div class="detail-row">
                    <span>Total</span>
                    <span id="total">-</span>
                </div>
            </div>
            
            <p>A confirmation email has been sent to your email address.</p>
            
            <div class="action-buttons">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i>
                    Continue Shopping
                </a>
                <a href="profile.html" class="btn btn-secondary">
                    <i class="fas fa-box"></i>
                    View Orders
                </a>
            </div>
        </div>
    </section>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize dark mode
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('darkModeIcon').classList.replace('fa-moon', 'fa-sun');
            }
            
            document.getElementById('darkModeToggle').addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                const newTheme = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                const icon = document.getElementById('darkModeIcon');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
                localStorage.setItem('theme', newTheme);
            });
            
            // Get order ID from URL
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('orderId');
            
            if (orderId && window.API?.TokenService?.isLoggedIn()) {
                try {
                    const response = await window.API.OrdersAPI.getById(orderId);
                    if (response.success) {
                        const order = response.data;
                        document.getElementById('orderNumber').textContent = order.orderNumber;
                        document.getElementById('itemCount').textContent = order.items.length + ' items';
                        document.getElementById('subtotal').textContent = '$' + order.itemsPrice.toFixed(2);
                        document.getElementById('shipping').textContent = order.shippingPrice === 0 ? 'FREE' : '$' + order.shippingPrice.toFixed(2);
                        document.getElementById('tax').textContent = '$' + order.taxPrice.toFixed(2);
                        document.getElementById('total').textContent = '$' + order.totalPrice.toFixed(2);
                    }
                } catch (error) {
                    console.error('Error loading order:', error);
                }
            } else {
                document.getElementById('orderNumber').textContent = 'TH' + Date.now().toString().slice(-8);
            }
            
            // Logo click
            document.querySelector('.logo').addEventListener('click', () => {
                window.location.href = 'index.html';
            });
            document.querySelector('.logo').style.cursor = 'pointer';
        });
    </script>
</body>
</html>
